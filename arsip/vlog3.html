<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen Gmail Tested</title>
<style>
body{font-family:Arial;margin:10px;padding:0;}
h1{text-align:center;}
input,select,button{padding:8px;margin:4px 0;width:100%;box-sizing:border-box;}
.unit{border:1px solid #ccc;padding:10px;margin-bottom:10px;border-radius:6px;}
.unit-header{font-weight:bold;display:flex;justify-content:space-between;cursor:pointer;}
.accounts{margin-top:5px;display:none;}
.account{padding:4px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;}
.status{padding:2px 5px;border-radius:4px;color:#fff;font-size:12px;}
.tersedia{background:green;}
.sedang-dikirim{background:orange;}
.terjual{background:gray;}
.ditolak{background:red;}
</style>
</head>
<body>

<h1>Manajemen Gmail Tested</h1>

<form id="unitForm">
  <input type="text" id="unitName" placeholder="Nama Unit / HP" required>
  <select id="unitType" required>
    <option value="">Pilih tipe</option>
    <option value="sendiri">Milik Sendiri</option>
    <option value="orang lain">Milik Orang Lain</option>
  </select>
  <button type="submit">Tambah Unit</button>
</form>

<div id="unitsContainer"></div>

<script>
// ===== DATA =====
let data = JSON.parse(localStorage.getItem('gmailManager')) || { units: [] };
function saveData(){ localStorage.setItem('gmailManager', JSON.stringify(data)); }

// ===== RENDER UNITS =====
function renderUnits(){
  const container = document.getElementById('unitsContainer');
  container.innerHTML = '';
  data.units.forEach((unit,index)=>{
    const div = document.createElement('div');
    div.className = 'unit';
    const header = document.createElement('div');
    header.className = 'unit-header';
    header.textContent = `${unit.name} (${unit.type})`;
    header.onclick = ()=>{ const acc = div.querySelector('.accounts'); acc.style.display = acc.style.display==='none'?'block':'none'; };
    div.appendChild(header);

    const accDiv = document.createElement('div'); accDiv.className='accounts';
    unit.accounts.forEach(acc=>{
      const a = document.createElement('div'); a.className='account';
      a.innerHTML = `<span>${acc.email}</span><span class="status ${acc.status}">${acc.status}</span>`;
      accDiv.appendChild(a);
    });
    div.appendChild(accDiv);
    container.appendChild(div);
  });
}

// ===== TAMBAH UNIT =====
document.getElementById('unitForm').addEventListener('submit', e=>{
  e.preventDefault();
  const name = document.getElementById('unitName').value.trim();
  const type = document.getElementById('unitType').value;
  if(!name || !type) return alert("Nama dan tipe harus diisi");
  data.units.push({name:type?name:'Unit',type:type,accounts:[]});
  saveData();
  renderUnits();
  e.target.reset();
});

// ===== INIT =====
renderUnits();
</script>

</body>
</html>
