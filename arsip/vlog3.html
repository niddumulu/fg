<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manajemen Gmail - Milik Sendiri / Orang Lain</title>
<style>
  body { font-family: Arial, sans-serif; margin: 10px; padding-bottom:50px;}
  h1 { text-align:center; margin-bottom:20px; }
  .unit { border:1px solid #ccc; border-radius:6px; margin-bottom:15px; overflow:hidden; }
  .unit-header { background:#f0f0f0; padding:10px; font-weight:bold; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .accounts { display:none; padding:10px; background:#fafafa; }
  .account { display:flex; justify-content:space-between; flex-wrap:wrap; padding:5px 0; border-bottom:1px solid #eee;}
  .account-info { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
  .status { padding:2px 6px; border-radius:4px; color:#fff; font-size:12px; }
  .tersedia { background-color:green; }
  .sedang-dikirim { background-color:orange; }
  .terjual { background-color:gray; }
  .ditolak { background-color:red; }
  .source { font-size:12px; padding:2px 6px; border-radius:4px; background:#007bff; color:#fff; }
  .btn { margin:2px; padding:2px 5px; cursor:pointer; }
  input, select, button { padding:6px; border-radius:4px; border:1px solid #ccc; box-sizing:border-box; margin:2px 0; }
  .form-inline { display:flex; flex-direction:column; gap:5px; margin-top:5px; }
  .edit-form { display:flex; flex-direction:column; gap:5px; margin-top:5px; background:#f9f9f9; padding:5px; border-radius:4px; }
  @media(min-width:600px){ .form-inline{flex-direction:row; gap:5px;} .form-inline input, .form-inline select { flex:1;} }
  .summary { background:#e9e9e9; padding:10px; margin-bottom:10px; border-radius:6px; }
</style>
</head>
<body>

<h1>Manajemen Gmail</h1>

<!-- Form tambah HP/Unit -->
<form id="addUnitForm" class="form-inline">
  <input type="text" id="unitName" placeholder="Nama Unit / HP" required>
  <select id="unitType" required>
    <option value="">Pilih tipe</option>
    <option value="sendiri">Milik Sendiri</option>
    <option value="orang lain">Milik Orang Lain</option>
  </select>
  <button type="submit">Tambah Unit</button>
</form>

<div id="summaryContainer"></div>
<div id="unitsContainer"></div>

<script>
// ===== DATA & LOCALSTORAGE =====
let data = JSON.parse(localStorage.getItem('gmailManager')) || { units: [] };
function saveData(){ localStorage.setItem('gmailManager', JSON.stringify(data)); }

// ===== RENDER SUMMARY =====
function renderSummary(){
  const container = document.getElementById('summaryContainer');
  container.innerHTML='';
  let total=0, tersedia=0, kirim=0, terjual=0, ditolak=0;
  data.units.forEach(u=>{
    u.accounts.forEach(a=>{
      total++;
      if(a.status==='tersedia') tersedia++;
      else if(a.status==='sedang dikirim') kirim++;
      else if(a.status==='terjual') terjual++;
      else if(a.status==='ditolak') ditolak++;
    });
  });
  container.innerHTML=`<div class="summary">
    <strong>Rekap Akun:</strong> Total: ${total}, Tersedia: ${tersedia}, Sedang Dikirim: ${kirim}, Terjual: ${terjual}, Ditolak: ${ditolak}
  </div>`;
}

// ===== RENDER UNITS =====
function renderUnits(){
  renderSummary();
  const container=document.getElementById('unitsContainer');
  container.innerHTML='';
  data.units.forEach((unit,uIndex)=>{
    const unitDiv=document.createElement('div'); unitDiv.className='unit';
    const header=document.createElement('div'); header.className='unit-header';
    header.innerHTML=`${unit.name} (${unit.type}) <span>${unit.accounts.length} akun</span>`;
    header.onclick=()=>{ const accDiv=unitDiv.querySelector('.accounts'); accDiv.style.display=accDiv.style.display==='none'?'block':'none'; };
    const delBtn=document.createElement('button'); delBtn.textContent='Hapus Unit'; delBtn.className='btn';
    delBtn.onclick=e=>{ e.stopPropagation(); if(confirm(`Hapus Unit "${unit.name}" beserta semua akun?`)){ data.units.splice(uIndex,1); saveData(); renderUnits();} };
    header.appendChild(delBtn);
    unitDiv.appendChild(header);

    const accDiv=document.createElement('div'); accDiv.className='accounts';
    unit.accounts.forEach((acc,aIndex)=>{
      const accItem=document.createElement('div'); accItem.className='account';
      const info=document.createElement('div'); info.className='account-info';
      const emailSpan=document.createElement('span'); emailSpan.textContent=acc.email;
      const statusSpan=document.createElement('span'); statusSpan.className='status '+(acc.status==='sedang dikirim'?'sedang-dikirim':acc.status); statusSpan.textContent=acc.status;
      const sourceSpan=document.createElement('span'); sourceSpan.className='source'; sourceSpan.textContent=acc.source;
      info.append(emailSpan,statusSpan,sourceSpan);

      const btnDiv=document.createElement('div');
      const editBtn=document.createElement('button'); editBtn.textContent='Edit'; editBtn.className='btn';
      editBtn.onclick=()=>showEditForm(uIndex,aIndex,accItem,acc);
      btnDiv.appendChild(editBtn);
      const delAccBtn=document.createElement('button'); delAccBtn.textContent='Hapus'; delAccBtn.className='btn';
      delAccBtn.onclick=()=>{ if(confirm(`Hapus akun ${acc.email}?`)){ data.units[uIndex].accounts.splice(aIndex,1); saveData(); renderUnits(); } };
      btnDiv.appendChild(delAccBtn);

      accItem.append(info,btnDiv); accDiv.appendChild(accItem);
    });

    // Form tambah akun per unit
    const addForm=document.createElement('form'); addForm.className='form-inline';
    addForm.onsubmit=e=>{
      e.preventDefault();
      const email=addForm.querySelector('.email').value.trim();
      const status=addForm.querySelector('.status').value;
      if(!email || !status) return;
      const newAcc={email,status};
      newAcc.source=unit.type==='sendiri'?'buat sendiri':'beli';
      data.units[uIndex].accounts.push(newAcc); saveData(); renderUnits();
    };
    const emailInput=document.createElement('input'); emailInput.placeholder='Email Gmail'; emailInput.className='email'; emailInput.required=true;
    const statusSelect=document.createElement('select'); statusSelect.className='status'; statusSelect.required=true;
    statusSelect.innerHTML=`<option value="">Status</option><option value="tersedia">Tersedia</option><option value="sedang dikirim">Sedang Dikirim</option><option value="terjual">Terjual</option><option value="ditolak">Ditolak</option>`;
    const submitBtn=document.createElement('button'); submitBtn.textContent='Tambah Akun';
    addForm.append(emailInput,statusSelect,submitBtn);
    accDiv.appendChild(addForm);

    unitDiv.appendChild(accDiv);
    container.appendChild(unitDiv);
  });
}

// ===== EDIT FORM =====
function showEditForm(uIndex,aIndex,accItem,acc){
  if(accItem.querySelector('.edit-form')) return;
  const form=document.createElement('form'); form.className='edit-form';
  form.onsubmit=e=>{
    e.preventDefault();
    const newStatus=form.querySelector('.status').value;
    const newUnit=parseInt(form.querySelector('.unitSelect').value);
    acc.status=newStatus;
    if(newUnit!==uIndex){
      const moved={...acc};
      data.units[newUnit].accounts.push(moved);
      data.units[uIndex].accounts.splice(aIndex,1);
    }
    saveData(); renderUnits();
  };
  const statusSelect=document.createElement('select'); statusSelect.className='status';
  statusSelect.innerHTML=`<option value="tersedia">Tersedia</option><option value="sedang dikirim">Sedang Dikirim</option><option value="terjual">Terjual</option><option value="ditolak">Ditolak</option>`; statusSelect.value=acc.status;
  const unitSelect=document.createElement('select'); unitSelect.className='unitSelect';
  data.units.forEach((u,index)=>{ const opt=document.createElement('option'); opt.value=index; opt.textContent=u.name; if(index===uIndex) opt.selected=true; unitSelect.appendChild(opt); });
  const submitBtn=document.createElement('button'); submitBtn.textContent='Simpan';
  form.append(statusSelect,unitSelect,submitBtn);
  accItem.appendChild(form);
}

// ===== TAMBAH UNIT =====
document.getElementById('addUnitForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('unitName').value.trim();
  const type=document.getElementById('unitType').value;
  if(!name || !type) return;
  data.units.push({name,type,accounts:[]}); saveData(); renderUnits();
  e.target.reset();
});

// ===== INIT =====
renderUnits();
</script>
</body>
</html>
